- hosts: all
  gather_facts: true

- hosts: webservers
  become: true
  become_method: sudo
  gather_facts: yes
  tasks:
    - name: apt update
      apt:
        update_cache: true
        
    - name: Install python3, pip3 venv
      become: true
      apt:
        name:
          - python3
          - python3-pip
          - python3-venv
        update_cache: yes
        
    - name: Install flask
      become: true
      pip:
        executable: pip3
        name: flask
        state: latest
        
    - name: Installing Gunicorn
      apt:
        name: gunicorn
        
    - name: Copy flask app to remote server
      copy:
        src: /$PWD/application2.py
        dest: /home/ubuntu/application2.py
        owner: ubuntu
        mode: "0644"
        
    - name: Running Flask application
      shell: gunicorn -w 2 -D -b 0.0.0.0:7000 application2:app

    - name: Configure HAproxy load balancer
      hosts: HAproxy
      become: yes
      become_method: sudo
      tasks:
        - name: apt update
          apt:
            update_cache: yes
        
    - name: Install HAproxy
      apt:
        name: haproxy
        state: latest
        
    - name: Configure HAproxy
      template:
        src: haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
      become: yes
      
    - name: Restart haproxy
      service:
        name: haproxy
        state: restarted
